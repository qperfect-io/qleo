[project]
name = "qleo"
version = "0.22.1"
description = "Quobly Logical Emulator Online"
authors = [{ name = "QPerfect", email = "guido.masella@qperfect.io" }]
readme = "README.md"
requires-python = ">=3.9,<4"
dependencies = [
    "quantanium (>=1.15.24,<2.0.0)"
]
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/qperfect-io/qleo"
Documentation = "https://docs.qperfect.io/qleo"
Repository = "https://github.com/qperfect-io/qleo"
Issues = "https://github.com/qperfect-io/qleo/issues"

[project.optional-dependencies]
visualization = ["matplotlib (>=3.8,<4)"]
cudaq = ["cudaq (<1)"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["src"]  # ["."] by default